<style>

:root[data-theme="dark"]{--bg:#10151d;--paper:#18202b;--ink:#e8edf3;--mute:#9aa6b6;--line:#2c3746;--jade:#4cc2b0;--ok:#6fd49b;--okbg:#14342390;--bad:#ff8a80;--badbg:#3a1a18;--seal:#ff7a6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
main{max-width:720px;margin:0 auto;padding:16px 14px 60px}
.zh{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
header{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:22px;margin-bottom:16px}
h1{margin:0 0 4px;font-size:1.4rem;line-height:1.25}
h1 .zh{display:block;font-size:2.3rem;font-weight:700;letter-spacing:.08em}
header p{margin:8px 0 0;color:var(--mute);font-size:.95rem}
.name{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.name input{flex:1 1 160px;font:inherit;padding:8px 10px;border:0;border-bottom:1px solid var(--ink);background:transparent;color:var(--ink)}
.start{margin-top:16px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.r1{display:flex;align-items:center;gap:10px}
#tm{font-variant-numeric:tabular-nums;font-size:1.15rem}
.bar.warn #tm{color:var(--seal)}
#cnt{flex:1;font-size:.8rem;line-height:1.35;color:var(--mute)}

.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:8px}

.tabs button.full{border-color:var(--jade)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button.on em{color:inherit}
section{display:none}
section.on{display:block}
section>h2{font-size:1.05rem;margin:0 0 4px}
.sk{font-weight:400;color:var(--mute);font-size:.8rem}
section>p{margin:0 0 12px;color:var(--mute);font-size:.9rem}
.note{margin:0 0 12px!important;padding:8px 12px;border-left:4px solid var(--bad);background:var(--badbg);color:var(--bad)!important;font-weight:600;font-size:.95rem!important}
.q{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px}
.q.ok{border-color:var(--ok)}.q.bad{border-color:var(--bad)}
.qt{margin:0 0 10px;font-size:1.2rem}
.qt b{color:var(--jade);font-family:"Be Vietnam Pro",sans-serif;font-size:.9rem;margin-right:6px}
.qt i{font-style:normal;display:inline-block;min-width:3em;border-bottom:2px solid var(--ink);text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.opts{grid-template-columns:1fr}main{padding:10px 10px 60px}}
label{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:1.05rem}
label:hover{border-color:var(--jade)}
input[type=radio]{accent-color:var(--jade);width:18px;height:18px;flex:none}
label:focus-within{outline:2px solid var(--jade);outline-offset:2px}
label.right{background:var(--okbg);border-color:var(--ok)}
label.wrong{background:var(--badbg);border-color:var(--bad)}
.wi{width:100%;box-sizing:border-box;font-size:1.2rem;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink)}
.wi:focus{outline:2px solid var(--jade);outline-offset:2px}
.au{display:flex;align-items:center;gap:12px;margin:0 0 10px;font-size:.88rem;color:var(--mute)}
.ex{display:none;margin:10px 0 0;font-size:.88rem;color:var(--mute);border-left:3px solid var(--jade);padding-left:10px}
.done .ex{display:block}
button{font:inherit;font-weight:600;padding:10px 20px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.au button{padding:8px 16px}
#sub{padding:8px 16px;white-space:nowrap;background:var(--seal);border-color:var(--seal);color:#fff}
#sub:disabled{background:var(--line);border-color:var(--line);color:var(--mute)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:18px 0}
#res{display:none;position:relative;background:var(--paper);border:2px solid var(--seal);border-radius:6px;padding:20px;margin:0 0 16px;text-align:center}
#res .sc{font-size:3rem;font-weight:700;color:var(--seal);line-height:1.1}
#res p{margin:6px 0 0;color:var(--mute)}
.mk{position:absolute;right:8px;bottom:6px;line-height:0}
.mk s{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--mute);opacity:.3;margin-left:3px}
.mk s:nth-child(5n){margin-right:7px}
@media print{.bar,.nav{display:none}section{display:block}}
</style>
</head>

var SK={A:'Nghe',B:'Nghe',C:'Đọc',D:'Đọc',E:'Viết',F:'Viết'},SH={A:'Nghe hiểu',B:'Nghe chép',C:'Từ vựng',D:'Ngữ pháp',E:'Viết câu',F:'Chọn câu'},CNT={Nghe:0,Đọc:0,Viết:0};
var K='hsk3mk1',T=0,done=false,tick=null,t0=0,plays={},tok=0,cur=null,busy=false,ci=0,SC=[],f=document.getElementById('f'),mn=document.querySelector('main'),tabs=document.getElementById('tabs');
S.forEach(function(s){T+=s.q.length;CNT[SK[s.t.charAt(0)]]+=s.q.length});
function pq(s){return (Math.round(100/CNT[SK[s.t.charAt(0)]]*10)/10).toString().replace('.',',')}
if(location.hash==='#gv-reset'){try{localStorage.removeItem(K)}catch(e){}}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(s){return s.replace(/[\s，。？！、,.?!；;：:“”"']/g,'')}
function esc(s){return s.replace(/</g,'&lt;')}
function fmt(s){s=Math.max(0,s);return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
/* ---- audio: chỉ một file chạy tại một thời điểm ---- */
function halt(){tok++;if(cur){cur.onended=null;cur.onerror=null;try{cur.pause()}catch(e){}cur=null}try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}busy=false;lock()}
function lock(){f.querySelectorAll('.pl').forEach(function(b){b.disabled=busy||(plays[b.getAttribute('data-n')]||0)>=2})}
function play(id,end){
 halt();var tk=++tok,fb=false,au=new Audio('audio/'+id+'.mp3');cur=au;
 function fin(){if(tk===tok){cur=null;end()}}
 function fall(){if(fb||tk!==tok)return;fb=true;cur=null;
  try{var u=new SpeechSynthesisUtterance(L[id]);u.lang='zh-CN';u.rate=.8;u.onend=fin;u.onerror=fin;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){fin()}}
 au.onended=fin;au.onerror=fall;var p=au.play();if(p&&p.catch)p.catch(fall);
}
f.addEventListener('click',function(e){
 var b=e.target.closest&&e.target.closest('.pl');if(!b||done||busy)return;
 var n=b.getAttribute('data-n');plays[n]=plays[n]||0;if(plays[n]>=2)return;
 plays[n]++;var r=2-plays[n];
 document.getElementById('pc'+n).textContent=r?'còn '+r+' lần':'đã hết lượt nghe';
 play(b.getAttribute('data-a'),function(){busy=false;lock()});
 busy=true;lock();
});
/* ---- dựng đề ---- */
function build(){
 var h='',n=0,t='';
 S.forEach(function(s,i){
  var l=s.t.charAt(0);
  t+='<button type="button" data-i="'+i+'"><span>'+SH[l]+'</span><em></em></button>';
  h+='<section data-i="'+i+'"><h2>'+s.t+' <small class="sk">· kỹ năng '+SK[l]+' · '+pq(s)+' điểm/câu</small></h2><p>'+s.d+'</p>'
   +(s.q[0][5]==='w'?'<p class="note">Lưu ý: gõ liền các chữ Hán, không cần gõ dấu câu, không cần cách chữ.</p>':'');
  s.q.forEach(function(q){
   n++;var w=q[5]==='w',a=q[4];
   h+='<div class="q" id="q'+n+'"><p class="qt zh"><b>'+n+'.</b>'+q[1].replace('____','<i></i>')+'</p>';
   if(a)h+='<div class="au"><button type="button" class="ghost pl" data-a="'+a+'" data-n="'+n+'">▶ 播放</button><span id="pc'+n+'">còn 2 lần</span></div>';
   if(w)h+='<input class="wi zh" id="w'+n+'" autocomplete="off" placeholder="请输入汉字">';
   else{
    h+='<div class="opts zh">';
    sh(q[2].map(function(o,k){return [o,k]})).forEach(function(p,x){
     h+='<label><input type="radio" name="q'+n+'" value="'+p[1]+'">'+'ABCD'[x]+'. '+p[0]+'</label>';
    });
    h+='</div>';
   }
   h+='<p class="ex">'+q[3]+'</p></div>';
  });
  h+='</section>';
 });
 f.innerHTML=h;tabs.innerHTML=t;show(0);
}
function ans(q){var r=q.querySelector('input[type=radio]:checked');if(r)return true;var w=q.querySelector('.wi');return !!(w&&w.value.trim())}
function stat(){
 var tot=0;
 f.querySelectorAll('section').forEach(function(sc,i){
  var qs=sc.querySelectorAll('.q'),a=0;
  qs.forEach(function(q){if(ans(q))a++});tot+=a;
  var b=tabs.children[i];
  b.querySelector('em').textContent=(done?SC[i]:a)+'/'+qs.length;
  b.classList.toggle('full',a===qs.length);
 });
 document.getElementById('cnt').innerHTML='Đã làm <b>'+tot+'</b> · Chưa làm <b>'+(T-tot)+'</b> · Tổng <b>'+T+'</b>';
 return tot;
}
function show(i){
 ci=i;halt();
 f.querySelectorAll('section').forEach(function(s,k){s.className=k===i?'on':''});
 Array.prototype.forEach.call(tabs.children,function(b,k){b.className=(k===i?'on ':'')+(b.className.indexOf('full')>-1?'full':'')});
 document.getElementById('pv').disabled=i===0;
 document.getElementById('nx').disabled=i===S.length-1;
 stat();window.scrollTo(0,0);
}
tabs.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button');if(b)show(+b.getAttribute('data-i'))});
document.getElementById('pv').onclick=function(){show(ci-1)};
document.getElementById('nx').onclick=function(){show(ci+1)};
f.addEventListener('change',stat);f.addEventListener('input',stat);
/* ---- thi ---- */
document.getElementById('go').onclick=function(){
 var nm=document.getElementById('nm');
 if(!nm.value.trim()){nm.focus();alert('Hãy nhập họ và tên trước khi bắt đầu.');return}
 mn.className='';t0=Date.now();
 tick=setInterval(function(){
  var left=3600-Math.floor((Date.now()-t0)/1000);
  document.getElementById('tm').textContent=fmt(left);
  if(left<=600)document.getElementById('bar').className='bar warn';
  if(left<=0)submit(true);
 },1000);
 window.scrollTo(0,0);
};
function submit(auto){
 if(done)return;
 var c=stat();
 if(!auto&&c<T&&!confirm('Còn '+(T-c)+' câu chưa làm. Vẫn nộp bài?'))return;
 done=true;clearInterval(tick);halt();
 var used=Math.min(3600,Math.floor((Date.now()-t0)/1000));
 f.className='done';
 var ok=0,sec=[],n=0,sk={Nghe:[0,0],Đọc:[0,0],Viết:[0,0]};
 S.forEach(function(s,i){
  var r=0;
  s.q.forEach(function(q){
   n++;var box=document.getElementById('q'+n),good=false;
   if(q[5]==='w'){
    var wi=document.getElementById('w'+n);wi.disabled=true;
    var g=q[6]==='d'?function(x){return norm(x).replace(/她/g,'他')}:norm;var v=g(wi.value);
    good=q[2].some(function(a){return g(a)===v});
   }else{
    var sel=f.querySelector('input[name=q'+n+']:checked');
    f.querySelectorAll('input[name=q'+n+']').forEach(function(x){
     x.disabled=true;
     if(x.value==='0')x.parentNode.className='right';
     else if(x.checked)x.parentNode.className='wrong';
    });
    good=!!sel&&sel.value==='0';
   }
   if(good){r++;box.className='q ok'}else box.className='q bad';
  });
  SC[i]=r;ok+=r;var kk=SK[s.t.charAt(0)];sk[kk][0]+=r;sk[kk][1]+=s.q.length;sec.push(s.t.charAt(0)+': '+r+'/'+s.q.length);
 });
 var tot=0,parts=[];
 Object.keys(sk).forEach(function(k){var v=Math.round(sk[k][0]/sk[k][1]*1000)/10;tot+=v;parts.push('<b>'+k+': '+v+'/100</b> ('+sk[k][0]+'/'+sk[k][1]+' câu)')});
 var pts=Math.round(tot*10)/10;
 var cnt=0;try{cnt=(parseInt(localStorage.getItem(K),10)||0)+1;localStorage.setItem(K,cnt)}catch(e){cnt=0}
 var dots='';for(var d=0;d<cnt;d++)dots+='<s></s>';
 var rs=document.getElementById('res');
 rs.innerHTML='<p><b>'+esc(document.getElementById('nm').value)+'</b> '+esc(document.getElementById('cl').value)+'</p><div class="sc">'+pts+'/300</div><p>'+parts.join(' · ')+'</p><p>Đúng '+ok+'/'+T+' câu · '+sec.join(' · ')+'</p><p>Thời gian làm bài: '+fmt(used)+(auto?' (hết giờ, bài tự động nộp)':'')+'</p><p>Xem lại từng phần ở các thẻ phía trên để biết đáp án và giải thích.</p>'+(cnt?'<span class="mk" aria-hidden="true">'+dots+'</span>':'');
 rs.style.display='block';
 var sb=document.getElementById('sub');sb.disabled=true;sb.textContent='Đã nộp';
 stat();window.scrollTo(0,0);
}
document.getElementById('sub').onclick=function(){submit(false)};
build();
</script>
</body>
</html>
